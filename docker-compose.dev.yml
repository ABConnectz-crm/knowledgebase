version: '3.8'

# Development version of docker-compose
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: knowledgebase-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgebase
      POSTGRES_PASSWORD: knowledgebase
      POSTGRES_DB: knowledgebase
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - knowledgebase-dev-network

volumes:
  postgres_dev_data:
    driver: local

networks:
  knowledgebase-dev-network:
    driver: bridge
