version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: knowledgebase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgebase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgebase}
      POSTGRES_DB: knowledgebase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - knowledgebase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgebase"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: knowledgebase-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://knowledgebase:${POSTGRES_PASSWORD:-knowledgebase}@postgres:5432/knowledgebase?schema=public
      API_KEY: ${API_KEY:-change-this-to-a-secure-random-key}
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - knowledgebase-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/docs/nav', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Web Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: knowledgebase-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADMIN_API_KEY: ${API_KEY:-change-this-to-a-secure-random-key}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - knowledgebase-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: knowledgebase-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - knowledgebase-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  knowledgebase-network:
    driver: bridge
